${o.timeChange ? `\nTime changed by you - customer asked: ${esc(o.timeChange.from)}` : ""}
        ${(o.chat || []).length ? `<div class="chatlog">${o.chat.map((m) => `<div class="${m.from}"><b>${m.from === "chef" ? "You" : esc(name.split(" ")[0])}:</b> ${esc(m.text)}</div>`).join("")}</div>` : ""}
        ${S.ui.editMenu === o.id ? `<div class="btns"><button data-a="chef-editp" data-x="${o.id}">Change price</button><button data-a="chef-editt" data-x="${o.id}">Change time</button><button data-a="chef-msg" data-x="${o.id}">Message customer</button></div>` : ""}
        ${S.ui.editPrice === o.id ? `<div class="inline"><input id="f-price" data-in="price" inputmode="decimal" placeholder="New total, e.g. ${(o.subtotal + 50).toFixed(0)}"><button data-a="chef-price" data-x="${o.id}">Save price</button></div>` : ""}
        ${S.ui.editTime === o.id ? `<div class="inline"><input id="f-ctime" data-in="ctime" placeholder="${o.type === "lds" ? "6:30 PM - 8:30 PM" : "12:30 PM"}"><button data-a="chef-time" data-x="${o.id}">Save time</button></div>${S.ui.timeErr === o.id ? `<div class="small" style="color:var(--bad)">Sorry, I couldn't read that time. Reply like "12:30 PM" or "6:30 PM - 8:30 PM" (with AM/PM).</div>` : ""}` : ""}
        ${S.chat === o.id ? `<div class="inline"><input id="f-cmsg" data-in="cmsg" placeholder="Type a message to ${esc(name.split(" ")[0])}"><button data-a="chef-send" data-x="${o.id}">Send</button></div>` : ""}
        <div class="btns"><button data-a="chef-approve" data-x="${o.id}">Approve</button>${S.chat === o.id ? `<button data-a="chef-endchat" data-x="${o.id}">End chat</button>` : `<button data-a="chef-edit" data-x="${o.id}">Edit / message</button>`}<button data-a="chef-decline" data-x="${o.id}">Decline</button></div></div>`);
    }
    if (o.stage === "deposit_review") {
      cards.push(`<div class="msg"><div class="hd">Deposit screenshot</div>${esc(name)} (${ph}) sent a Zelle screenshot for ${o.id}.\nDeposit due: ${money(o.payment.depositDue, true)} (order total ${money(o.subtotal, true)})\n\nOpen your bank app - tap Payment received only once you see the money.
        ${o.payment.shot ? `<img src="${o.payment.shot}" alt="Customer's screenshot" style="display:block;max-height:160px;margin-top:8px;border-radius:8px">` : ""}
        <div class="btns"><button data-a="chef-paid" data-x="${o.id}">Payment received</button><button data-a="chef-unpaid" data-x="${o.id}">Not received</button></div></div>`);
    }
    if (o.stage === "quote_requested") {
      cards.push(`<div class="msg"><div class="hd">New custom request</div>Request ${o.id} from ${esc(name)} (${ph}):\n\n"${esc(o.request)}"
        ${S.ui.quoting === o.id ? `<div class="inline"><input id="f-qprice" data-in="qprice" inputmode="decimal" placeholder="Price, e.g. 900"><input id="f-qnote" data-in="qnote" placeholder="Note for the customer (optional)"><button data-a="chef-sendquote" data-x="${o.id}">Send quote</button></div>` : ""}
        <div class="btns"><button data-a="chef-quote" data-x="${o.id}">Send quote</button><button data-a="chef-cdecline" data-x="${o.id}">Decline</button></div></div>`);
    }
    if (o.stage === "deposit_due") {
      cards.push(`<div class="msg" style="opacity:.85">Order ${o.id} approved - customer asked for a ${money(o.payment.depositDue, true)} Zelle deposit, due by ${deadlineLabel(o.payment.deadline)}. You'll get their screenshot to confirm.
        <div class="btns"><button data-a="chef-release" data-x="${o.id}">Simulate: deadline passed</button></div></div>`);
    }
  });
  S.questions && S.questions.forEach((q) => cards.push(`<div class="msg">Question from ${esc(name)} (${ph}) via the FTR app:\n\n"${esc(q)}"\n\nReply to them directly at that number.</div>`));
  const rows = S.sheet.map((r) => `<tr><td>${esc(r.ts)}</td><td>${r.id}</td><td>${esc(r.name)}</td><td>${r.phone}</td><td>${esc(r.items)}</td><td class="num">${r.subtotal}</td><td>${r.fulfillment}</td><td>${esc(r.address)}</td><td>${esc(r.time)}</td><td>${esc(r.status)}</td><td>${esc(r.payment)}</td></tr>`).join("");
  const sw = (k, label, hint) => `<div class="toggle" style="font-weight:500"><span><b>${label}</b><br><span class="small muted">${hint}</span></span><button class="switch ${S.settings[k] ? "on" : ""}" role="switch" aria-checked="${S.settings[k]}" aria-label="${label}" data-a="setting" data-x="${k}"></button></div>`;
  const dayRows = baseDates().map((d, i) => `<div class="row" style="gap:6px;flex-wrap:wrap"><b style="width:92px;flex:none">${dateLabel(d)}</b>${[["am", "Lunch 11:30"], ["pm", "Dinner 6:30"], ...(S.settings.pickupOnly ? [] : [["delivery", "Delivery"]]), ["ldsL", "LIVE 11–1"], ["ldsE", "LIVE 7–9"]].map(([k, l]) => `<button class="opt ${S.days[i][k] ? "on" : ""}" style="padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600${k === "delivery" && S.settings.pickupOnly ? ";opacity:.5" : ""}" data-a="day" data-x="${i}" data-y="${k}" aria-pressed="${S.days[i][k]}">${l}</button>`).join("")}</div>`).join("");
  const admin = `<button class="ghost" data-a="kitchen" style="align-self:flex-start">Open Chef's Kitchen on the phone</button>
  <div class="panel" style="background:var(--wa-bubble)"><div style="font:700 18px var(--f-display)">Admin switches <span class="small muted" style="font-family:var(--f-body);font-weight:400">· /admin › Setup and Calendar</span></div><div class="small muted">These stand in for your real admin page. The real app reads the menu and these settings straight from your bot server, so it always matches what you set there.</div>
    <div class="stack" style="gap:12px;margin-top:10px">
      ${sw("pickupOnly", "Catering: pickup only", "Off = customers can choose delivery")}
      ${sw("halfTrays", "Half-tray orders", "Half tray = 65% of a full tray; minimum $100")}
      ${sw("deposit", "Ask for a Zelle deposit", "Off = orders are confirmed when you approve")}
      <div class="stack" style="gap:8px"><b class="small">Open dates</b>${dayRows}<span class="small muted">Standard times on every chef day: pickup 11:30 AM and 6:30 PM; LIVE Dose serving 11 AM – 1 PM and 7 PM – 9 PM, plus ${EXT.minutes} extra minutes for ${money(EXT.fee)} if the customer wants it.</span></div>
    </div></div>`;
  return `<div class="chef-head"><span class="mark"></span><h2>Chef's WhatsApp</h2><span class="small muted">What your bot sends you</span></div>${admin}
    ${cards.length ? cards.join("") : `<div class="empty">Nothing waiting. Place an order on the phone and the approval prompt appears here.</div>`}
    ${S.chefLog.length ? `<div><b class="small">Recent</b><div class="log">${S.chefLog.slice(0, 8).map((l) => `<span>${esc(l)}</span>`).join("")}</div></div>` : ""}
    <div><b class="small">Google Sheet · Orders tab</b><div class="sheetrow" style="margin-top:6px"><table><thead><tr><th>Timestamp</th><th>Order ID</th><th>Customer Name</th><th>Phone</th><th>Items</th><th>Subtotal</th><th>Fulfillment</th><th>Address</th><th>Requested Time</th><th>Status</th><th>Payment</th></tr></thead><tbody>${rows || `<tr><td colspan="11" class="muted">Rows appear here as orders come in.</td></tr>`}</tbody></table></div></div>
    ${S.user ? `<div><button class="ghost" data-a="samples">Add sample past orders</button> <span class="small muted">Shows how earlier orders are listed by month.</span></div>` : ""}
    <details class="howto"><summary>Things to try</summary><ul class="small" style="margin:8px 0 0;padding-left:18px;display:grid;gap:4px">
      <li>Add 2 trays of Bisi Bele Bhath, check out, sign in (the code arrives as a text at the top of the phone), then tap Approve here.</li>
      <li>Upload any picture as the Zelle screenshot, then tap Payment received.</li>
      <li>Add Palya - the app won't let you add it without choosing a vegetable.</li>
      <li>Plan a 150-plate LIVE Dose Station, pick the 7 PM session and add 30 minutes for $100. Try the Philadelphia address to see the out-of-range request.</li>
      <li>On a waiting order, tap Edit / message → Change time (e.g. "12:30 PM"), then Message customer, reply on the phone, and Approve.</li>
      <li>Ask for a custom quote, send a price from here, and accept it in Messages.</li>
    </ul></details>`;
}

// ------------------------------------------------------------------ render
function render(scrollTop) {
  const screen = document.getElementById("screen");
  const prevBody = screen.querySelector(".body");
  const keep = !scrollTop && prevBody ? prevBody.scrollTop : 0;
  const tab = S.ui.tab;
  const content = tab === "menu" ? menuScreen() : tab === "orders" ? ordersScreen() : tab === "messages" ? messagesScreen() : accountScreen();
  const ordersBadge = S.orders.filter(needsYou).length, msgBadge = unread();
  const now = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(/ [AP]M/, "");
  screen.innerHTML = `<div class="status"><span class="num">${now}</span><span class="island"></span><span>●●● ▮</span></div>${content}
    <nav class="tabs" ${S.ui.tab === "account" && cur() && cur().screen === "kitchen" ? "hidden" : ""}>${["menu", "orders", "messages", "account"].map((t) => `<button class="tab ${tab === t ? "on" : ""}" data-a="tab" data-x="${t}" aria-current="${tab === t}">${ICON[t]}${t === "messages" ? "Notifications" : t[0].toUpperCase() + t.slice(1)}${t === "orders" && ordersBadge ? `<span class="badge">${ordersBadge}</span>` : ""}${t === "messages" && msgBadge ? `<span class="badge">${msgBadge}</span>` : ""}</button>`).join("")}</nav>
    ${sheetHTML()}${S.ui.sms ? `<div class="sms" role="status"><div class="small muted"><b>${S.ui.smsVia === "sms" ? "Messages" : "WhatsApp"}</b> · now</div><div><b>FTR:</b> ${CODE} is your FTR verification code. (Simulator - nothing is really sent.)</div></div>` : ""}`;
  const b = screen.querySelector(".sheet .body") || screen.querySelector(".body");
  if (b && keep && !S.ui.sheet) b.scrollTop = keep;
  document.getElementById("chef").innerHTML = chefHTML();
  if (S.ui.tab === "messages" && S.user && unread()) setTimeout(() => { S.inbox.forEach((m) => (m.read = true)); save(); }, 1500);
  save();
}

// ------------------------------------------------------------------ actions
const A = {
  tab(x) { if (S.ui.tab === x) S.ui.stack[x] = []; S.ui.tab = x; render(true); },
  pop() { pop(); },
  dish(x) { draft.note = ""; openSheet("dish", { id: x, qty: 1 }); },
  lds() { draft.ldsnote = ""; openSheet("lds", {}); },
  cart() { openSheet("cart", { view: "cart" }); },
  close() { closeSheet(); },
  backdrop() { closeSheet(); },
  view(x) { S.ui.sheet.view = x; render(true); },
  step(x, y) {
    const d = Number(y), sh = S.ui.sheet;
    if (x === "qty") sh.qty = Math.min(ST.maxOrderQtyPerItem, Math.max(STEP(), sh.qty + d));
    else if (x.startsWith("m:")) { const id = x.slice(2); sh.q[id] = Math.min(ST.maxOrderQtyPerItem, Math.max(STEP(), (sh.q[id] || 1) + d)); }
    else if (x === "md") sh.md = Math.min(sh.total, Math.max(0, sh.md + d));
    else if (x.startsWith("line:")) { const l = S.cart.lines[+x.slice(5)]; l.qty = Math.min(ST.maxOrderQtyPerItem, Math.max(STEP(), l.qty + d)); }
    render();
  },
  adddish() {
    const sh = S.ui.sheet, d = dishById(sh.id), note = (draft.note || "").trim() || null;
    if (d.requiresNote && !note) return;
    if (S.cart.lds) S.cart = { lines: [], lds: null };
    const ex = S.cart.lines.find((l) => l.id === d.id && l.note === note);
    if (ex) ex.qty = Math.min(ST.maxOrderQtyPerItem, ex.qty + sh.qty); else S.cart.lines.push({ id: d.id, title: d.title, price: d.price, qty: sh.qty, note });
    closeSheet();
  },
  ldstotal(x) { const sh = S.ui.sheet; sh.total = +x; sh.md = Math.min(sh.md, sh.total); render(); },
  addlds() { const sh = S.ui.sheet; S.cart = { lines: [], lds: { total: sh.total, md: sh.md, note: (draft.ldsnote || "").trim() || null, price: ldsPrice(sh.total) } }; closeSheet(); },
  clearcart() { S.cart = { lines: [], lds: null }; render(); },
  rmline(x) { S.cart.lines.splice(+x, 1); render(); },
  tocheckout() {
    if (!S.user) { draft.phone = ""; draft.code = ""; openSheet("signin", { step: "phone", then: "checkout" }); return; }
    startCheckout();
  },
  flag(x) { S.ui.sheet[x] = !S.ui.sheet[x]; render(); },
  sampleaddr(x) { draft.addr = PLACES.find((p) => p.key === x).label; A.checkaddr(); },
  checkaddr() {
    const sh = S.ui.sheet, text = (draft.addr || "").trim();
    sh.askChef = false; sh.asTyped = false;
    if (text.length < 8 || !/\d/.test(text)) { sh.addr = { status: "none" }; render(); return; }
    const p = PLACES.find((pl) => text.toLowerCase().includes(pl.key));
    if (!p) sh.addr = { status: "none" };
    else { sh.addr = { status: "match", label: p.label, miles: p.miles, inRange: p.miles <= (S.cart.lds ? ST.delivery.ldsMaxMiles : ST.delivery.maxMiles), fee: S.cart.lds ? travelFee(p.miles) : null }; draft.addr = p.label; if (S.user) S.user.address = p.label; }
    render();
  },
  date(x) { const sh = S.ui.sheet; sh.date = x; sh.slot = null; const isLDS = !!S.cart.lds; const d = chefDates().find((c) => c.date === x); const sl = slotsFor(d, isLDS ? "lds" : "catering", isLDS ? S.cart.lds.total : 0, isLDS ? "delivery" : sh.ful || "pickup"); if (sl.length === 1) sh.slot = sl[0].id; render(); },
  slot(x) { S.ui.sheet.slot = x; render(); },
  extend(x) { S.ui.sheet.extend = x === "yes"; render(); },
  custreply(x) {
    const o = S.orders.find((q) => q.id === x), t = (draft["reply:" + x] || "").trim();
    if (!t || S.chat !== x) return;
    o.chat = (o.chat || []).concat([{ from: "customer", text: t, at: stamp() }]); draft["reply:" + x] = "";
    chefLog(`Reply about ${o.id} - ${S.user ? S.user.first + " " + S.user.last : "Customer"} says: ${t} (Your next message goes to them.)`); render();
  },
  place() {
    const sh = S.ui.sheet, isLDS = !!S.cart.lds;
    const dates = chefDates().map((d) => ({ ...d, slots: slotsFor(d, isLDS ? "lds" : "catering", isLDS ? S.cart.lds.total : 0, isLDS ? "delivery" : sh.ful || "pickup") }));
    const date = dates.find((d) => d.date === sh.date), slot = date && date.slots.find((s) => s.id === sh.slot);
    if (!date || !slot) return;
    const b = buildOrder(sh, date, slot);
    const titles = b.lines.map((l) => l.title);
    const o = { id: orderId("FTR"), createdAt: stamp(), createdDay: todayISO(), ...b, title: isLDS ? "LIVE Dose Station" : titles.length <= 2 ? titles.join(" & ") : `${titles[0]}, ${titles[1]} +${titles.length - 2}`, status: "Pending Approval", stage: "review" };
    S.orders.unshift(o); sheetRow(o);
    tell(`Thanks! Your order ${o.id} ($${o.subtotal.toFixed(2)}) is being reviewed - we'll confirm shortly. Once Chef approves, you'll get Zelle details for the 50% deposit.`, { orderId: o.id });
    S.cart = { lines: [], lds: null };
    S.ui.sheet = { type: "cart", view: "placed", orderId: o.id };
    render(true);
  },
  goorder(x) { S.ui.sheet = null; S.ui.tab = "orders"; S.ui.stack.orders = [{ screen: "order", id: x }]; render(true); },
  order(x) { push("order", { id: x }); },
  copy(x) { try { navigator.clipboard.writeText(x).catch(() => {}); } catch (e) { /* not allowed */ } },
  reorder(x) {
    const o = S.orders.find((q) => q.id === x);
    if (S.cart.lds) S.cart = { lines: [], lds: null };
    o.lines.forEach((l) => { const d = dishById(l.id); if (d) S.cart.lines.push({ id: d.id, title: d.title, price: d.price, qty: l.qty, note: l.note }); });
    S.ui.tab = "menu"; render(true);
  },
  quote(x, y) {
    const o = S.orders.find((q) => q.id === x); if (!o || o.stage !== "quote_ready") return;
    if (y === "yes" && !S.settings.deposit) {
      setStatus(o, "Confirmed", "confirmed");
      tell(`Confirmed! Your custom order ${o.id} is booked for ${money(o.subtotal, true)}.\nPayment is collected in person. Thank you!`, { orderId: o.id });
      chefLog(`CONFIRMED: custom order ${o.id} at ${money(o.subtotal, true)}.`);
    } else if (y === "yes") {
      const dep = Math.round(o.subtotal * 50) / 100;
      o.payment = { state: "awaiting", depositDue: dep, balance: o.subtotal - dep, deadline: Date.now() + 24 * 3600000 };
      setStatus(o, "Awaiting Deposit", "deposit_due");
      tell(`Great - you accepted the quote for custom order ${o.id} (${money(o.subtotal, true)}).`, { orderId: o.id });
      tell(depositText(o), { orderId: o.id });
      chefLog(`ACCEPTED: custom order ${o.id} at ${money(o.subtotal, true)}. Deposit requested.`);
    } else {
      setStatus(o, "Quote Declined", "closed");
      tell(`No problem - quote ${o.id} declined. Send "hi" any time if you'd like something else.`, { orderId: o.id });
      chefLog(`Customer declined the quote for ${o.id}.`);
    }
    render();
  },
  // sign-in
  sendcode(x) { if (String(draft.phone || "").replace(/\D/g, "").length !== 10) return; S.ui.sheet.step = "code"; S.ui.sheet.via = x || "whatsapp"; S.ui.smsVia = S.ui.sheet.via; S.ui.sms = true; render(); setTimeout(() => { S.ui.sms = false; render(); }, 15000); },
  signstep(x) { S.ui.sheet.step = x; S.ui.sheet.err = null; render(); },
  verify() {
    const sh = S.ui.sheet;
    if ((draft.code || "").replace(/\D/g, "") !== CODE) { sh.err = "That code isn't right. Please check the text message and try again."; draft.code = ""; render(); return; }
    sh.err = null; sh.step = "name"; S.ui.sms = false; render();
  },
  savename() {
    const sh = S.ui.sheet, f = (draft.first || "").trim(), l = (draft.last || "").trim();
    if (!f || !l) { sh.err = "Please enter your first and last name."; render(); return; }
    const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
    S.user = { phone: String(draft.phone).replace(/\D/g, ""), first: cap(f), last: cap(l) };
    const then = sh.then;
    S.ui.sheet = null;
    if (then === "checkout") startCheckout(); else if (then === "save") { openSheet("cart", { view: "cart" }); A.savecart(); } else if (then === "compose") openSheet("compose", { kind: sh.kind }); else render(true);
  },
  signin() { draft.phone = ""; draft.code = ""; openSheet("signin", { step: "phone" }); },
  signout() { S.user = null; render(true); },
  askdelete() { S.ui.confirmDelete = true; render(); },
  nodelete() { S.ui.confirmDelete = false; render(); },
  delete() { S.user = null; S.inbox = []; S.ui.confirmDelete = false; render(true); },
  compose(x) { draft.compose = ""; openSheet("compose", { kind: x }); },
  sendcompose() {
    const sh = S.ui.sheet, text = (draft.compose || "").trim();
    if (!S.user) { openSheet("signin", { step: "phone", then: "compose", kind: sh.kind }); return; }
    if (sh.kind === "custom" && text.length < 10) { sh.err = "Please tell us a bit more - the dishes, how many people, the date and pickup or delivery."; render(); return; }
    if (!text) return;
    if (sh.kind === "custom") {
      const o = { id: orderId("CUST"), createdAt: stamp(), createdDay: todayISO(), type: "custom", request: text, title: "Custom request", lines: [], subtotal: 0, status: "Custom - Awaiting Quote", stage: "quote_requested" };
      S.orders.unshift(o); sheetRow(o);
      tell(`Thanks! Your request ${o.id} has gone to the chef. You'll get a price quote here soon. If it's urgent, call us at ${ST.phoneDisplay}.`, { orderId: o.id });
    } else {
      S.questions = S.questions || []; S.questions.unshift(text);
      tell(`Thanks - we've passed your question along and will get back to you soon. If it's urgent, give us a call at ${ST.phoneDisplay}.`);
    }
    sh.sent = true; render();
  },
  // chef
  "chef-approve"(x) {
    const o = S.orders.find((q) => q.id === x);
    endChat(x);
    const tnote = `\nTime: ${o.requestedTime}` + (o.timeChange ? `\n\nPlease note: Chef has set your time to ${o.timeChange.to} (you asked for ${o.timeChange.from}).` : "");
    if (!S.settings.deposit) {
      setStatus(o, "Confirmed", "confirmed");
      tell(`Good news - your order ${o.id} is confirmed! Subtotal: $${o.subtotal.toFixed(2)}.${tnote}\n\nPayment will be collected ${o.type === "lds" ? "on the day of your event" : "at " + o.fulfillment}. See you then!`, { orderId: o.id });
      chefLog(`Order ${o.id} confirmed - customer notified (Zelle deposits are off).`);
      render();
      return;
    }
    const dep = Math.round(o.subtotal * 50) / 100;
    o.payment = { state: "awaiting", depositDue: dep, balance: Math.round((o.subtotal - dep) * 100) / 100, deadline: deadlineFor(o).getTime() };
    setStatus(o, "Awaiting Deposit", "deposit_due");
    tell(`Good news - Chef approved your order ${o.id}! Total: $${o.subtotal.toFixed(2)}.${tnote}`, { orderId: o.id });
    tell(depositText(o), { orderId: o.id });
    chefLog(`Approved ${o.id}. Deposit ${money(dep, true)} requested.`);
    render();
  },
  "chef-edit"(x) { S.ui.editMenu = S.ui.editMenu === x ? null : x; S.ui.editPrice = null; S.ui.editTime = null; render(); },
  "chef-editp"(x) { S.ui.editMenu = null; S.ui.editPrice = x; draft.price = ""; render(); },
  "chef-editt"(x) { S.ui.editMenu = null; S.ui.editTime = x; S.ui.timeErr = null; draft.ctime = ""; render(); },
  "chef-time"(x) {
    const o = S.orders.find((q) => q.id === x), ch = parseChefTime(draft.ctime || "", o);
    if (!ch) { S.ui.timeErr = x; render(); return; }
    const from = (o.timeChange && o.timeChange.from) || o.requestedTime;
    o.requestedTimeOriginal = from;
    o.requestedTime = ch + " (set by Chef)";
    o.timeChange = { from, to: ch };
    S.ui.editTime = null; S.ui.timeErr = null; sheetRow(o);
    chefLog(`Order ${o.id} time changed. Customer asked: ${from} · New time: ${ch}. They'll see it when you approve.`); render();
  },
  "chef-msg"(x) {
    const o = S.orders.find((q) => q.id === x);
    S.ui.editMenu = null; S.chat = x; draft.cmsg = "";
    chefLog(`Chat with ${S.user ? S.user.first + " " + S.user.last : "the customer"} about ${o.id} is open. Type below - it goes from the FTR number.`); render();
  },
  "chef-send"(x) {
    const o = S.orders.find((q) => q.id === x), t = (draft.cmsg || "").trim(); if (!t) return;
    o.chat = (o.chat || []).concat([{ from: "chef", text: t, at: stamp() }]); draft.cmsg = "";
    tell(`Message from Chef about your order ${o.id}:\n\n${t}\n\n(Tap Reply to answer Chef.)`, { orderId: o.id }); render();
  },
  "chef-endchat"(x) {
    endChat(x); tell(`Thanks! Chef will confirm your order ${x} here shortly.`, { orderId: x });
    chefLog(`Chat about ${x} ended. Approve or decline now?`); render();
  },
  "chef-price"(x) {
    const v = parseFloat(String(draft.price || "").replace(/[^0-9.]/g, ""));
    if (!(v > 0)) return;
    const o = S.orders.find((q) => q.id === x); o.subtotal = v; S.ui.editPrice = null; sheetRow(o);
    chefLog(`New price for ${o.id}: ${money(v, true)}. Tap Approve to send it.`); render();
  },
  "chef-decline"(x) {
    endChat(x);
    const o = S.orders.find((q) => q.id === x); setStatus(o, "Declined", "closed");
    tell(`Sorry, we're not able to take order ${o.id} right now. Please reach out to us directly, or type "menu" to try a different order.`, { orderId: o.id });
    chefLog(`Declined ${o.id} - customer notified.`); render();
  },
  "chef-paid"(x) {
    const o = S.orders.find((q) => q.id === x); o.payment.state = "paid"; setStatus(o, "Confirmed", "confirmed");
    tell(`Payment received - thank you! Your ${money(o.payment.depositDue, true)} deposit for order ${o.id} is confirmed and your date is locked in. The balance of ${money(o.payment.balance, true)} is due ${o.type === "lds" ? "on the day of your event" : "at pickup"}.`, { orderId: o.id, header: "Deposit confirmed" });
    chefLog(`${o.id} confirmed - customer notified.`); render();
  },
  "chef-unpaid"(x) {
    const o = S.orders.find((q) => q.id === x); o.payment.state = "awaiting"; setStatus(o, "Awaiting Deposit", "deposit_due");
    tell(`Chef hasn't received the ${money(o.payment.depositDue, true)} deposit for order ${o.id} yet. Please check the Zelle payment went to ${ST.payment.zelleTo} and send a new screenshot.`, { orderId: o.id });
    chefLog(`${o.id}: payment not received - customer asked to check.`); render();
  },
  "chef-release"(x) {
    const o = S.orders.find((q) => q.id === x); o.payment.state = "released"; setStatus(o, "Released - Unpaid", "closed");
    tell(`We didn't receive the deposit for order ${o.id} by the deadline, so the date has been released. Please call Chef at ${ST.phoneDisplay} if you'd still like to book.`, { orderId: o.id });
    chefLog(`${o.id} released - unpaid.`); render();
  },
  "chef-quote"(x) { S.ui.quoting = S.ui.quoting === x ? null : x; draft.qprice = ""; draft.qnote = ""; render(); },
  "chef-sendquote"(x) {
    const v = parseFloat(String(draft.qprice || "").replace(/[^0-9.]/g, "")); if (!(v > 0)) return;
    const o = S.orders.find((q) => q.id === x); o.subtotal = v; o.quote = { price: v, comment: (draft.qnote || "").trim() || null };
    setStatus(o, "Quote Sent", "quote_ready"); S.ui.quoting = null;
    tell(`Request ${o.id}\n"${o.request}"\n\nPrice: $${v.toFixed(2)}${o.quote.comment ? `\nChef's note: ${o.quote.comment}` : ""}\n\nA 50% Zelle deposit locks in your date. Would you like to go ahead?`, { orderId: o.id, header: "Your quote is ready", quoteFor: o.id });
    chefLog(`Quote for ${o.id} sent to the customer.`); render();
  },
  "chef-cdecline"(x) {
    const o = S.orders.find((q) => q.id === x); setStatus(o, "Declined", "closed");
    tell(`Sorry, the chef isn't able to take custom request ${o.id}.`, { orderId: o.id });
    chefLog(`Custom request ${o.id} declined.`); render();
  },
  samples() {
    const mk = (id, daysAgo, title, lines, status, stage) => {
      const ev = addDays(todayISO(), -daysAgo), sub = lines.reduce((s, l) => s + l.total, 0);
      return { id, createdAt: dateLabel(addDays(ev, -10)), createdDay: addDays(ev, -10), eventDate: ev, eventLabel: dateLabel(ev), type: lines[0].kind === "lds" ? "lds" : "catering",
        fulfillment: lines[0].kind === "lds" ? "delivery" : "pickup", title, lines, subtotal: sub, status, stage, requestedTime: `${dateLabel(ev)}, pickup by 11:30 AM (lunch)`, sample: true,
        payment: stage === "confirmed" ? { state: "paid", depositDue: sub / 2, balance: sub / 2, deadline: Date.now() } : null };
    };
    S.orders = S.orders.filter((o) => !o.sample).concat([
      mk("FTR-SAMPLE1", 14, "Bisi Bele Bhath & Payasa", [{ kind: "catering", id: "bisi-bele-bhath", title: "Bisi Bele Bhath", qty: 1, total: 170 }, { kind: "catering", id: "payasa", title: "Payasa", qty: 1, total: 100 }], "Confirmed", "confirmed"),
      mk("FTR-SAMPLE2", 40, "Vangi Bhath & Mosaranna", [{ kind: "catering", id: "vangi-bhath", title: "Vangi Bhath", qty: 1, total: 150 }, { kind: "catering", id: "mosaranna", title: "Mosaranna", qty: 1, total: 120 }], "Confirmed", "confirmed"),
      mk("FTR-SAMPLE3", 45, "Maddur Vade & Saaru", [{ kind: "catering", id: "maddur-vade", title: "Maddur Vade", qty: 2, total: 200 }, { kind: "catering", id: "saaru", title: "Saaru", qty: 1, total: 100 }], "Declined", "closed")
    ]);
    chefLog("Added 3 sample past orders (marked FTR-SAMPLE) to show the Past orders list.");
    render();
  },
  kitchen() { S.ui.tab = "account"; S.ui.stack.account = [{ screen: "kitchen" }]; render(true); },
  selectmode() { S.ui.selecting = !S.ui.selecting; S.ui.picked = []; render(); },
  pick(x) { const i = S.ui.picked.indexOf(x); if (i >= 0) S.ui.picked.splice(i, 1); else S.ui.picked.push(x); render(); },
  multi() { if (!S.ui.picked.length) return; S.ui.picked.forEach((id) => delete draft["mnote:" + id]); openSheet("multi", { ids: S.ui.picked.slice(), q: {} }); },
  multiadd() {
    const sh = S.ui.sheet; if (!multiReady(sh)) return;
    if (S.cart.lds) S.cart = { lines: [], lds: null };
    sh.ids.forEach((id) => { const d = dishById(id), note = (draft["mnote:" + id] || "").trim() || null, q = sh.q[id] || 1; const ex = S.cart.lines.find((l) => l.id === id && l.note === note); if (ex) ex.qty = Math.min(ST.maxOrderQtyPerItem, ex.qty + q); else S.cart.lines.push({ id, title: d.title, price: d.price, qty: q, note }); });
    S.ui.selecting = false; S.ui.picked = []; closeSheet();
  },
  savecart() {
    if (!S.user) { draft.phone = ""; draft.code = ""; openSheet("signin", { step: "phone", then: "save" }); return; }
    S.savedAt = stamp(); S.ui.sheet.saved = true; render();
  },
  ful(x) { const sh = S.ui.sheet; if (sh.ful === x) return; sh.ful = x; sh.date = null; sh.slot = null; sh.addr = null; render(); },
  filter(x) { S.ui.filter = x; render(); },
  setting(x) {
    S.settings[x] = !S.settings[x];
    const names = { pickupOnly: "Catering: pickup only", halfTrays: "Half-tray orders", deposit: "Ask for a Zelle deposit" };
    if (x === "halfTrays" && !S.settings.halfTrays) S.cart.lines.forEach((l) => (l.qty = Math.ceil(l.qty)));
    if (S.ui.sheet && S.ui.sheet.view === "checkout") { S.ui.sheet.date = null; S.ui.sheet.slot = null; }
    chefLog(`Setup: ${names[x]} turned ${S.settings[x] ? "on" : "off"}.`);
    render();
  },
  day(x, y) {
    S.days[+x][y] = !S.days[+x][y];
    if (S.ui.sheet && S.ui.sheet.view === "checkout") { S.ui.sheet.date = null; S.ui.sheet.slot = null; }
    chefLog(`Calendar: ${dateLabel(baseDates()[+x])} ${{ am: "Lunch pickup", pm: "Dinner pickup", delivery: "Delivery", ldsL: "LIVE Dose lunch session", ldsE: "LIVE Dose evening session" }[y]} ${S.days[+x][y] ? "opened" : "closed"}.`);
    render();
  },
  reset() { S = fresh(); Object.keys(draft).forEach((k) => delete draft[k]); render(true); }
};
function startCheckout() {
  draft.addr = (S.user && S.user.address) || "";
  animNext = !S.ui.sheet;
  S.ui.sheet = { type: "cart", view: "checkout" };
  if (S.cart.lds && draft.addr) A.checkaddr(); else render(true);
}
function depositText(o) {
  const p = o.payment;
  return `To lock in order ${o.id}, please send a 50% deposit by Zelle:\n\nAmount: ${money(p.depositDue, true)}\nSend to: ${ST.payment.zelleTo}\nMemo: ${o.id}\n\nPlease pay by ${deadlineLabel(p.deadline)}. The balance of ${money(p.balance, true)} is due ${o.type === "lds" ? "on the day of your event" : o.type === "custom" ? "on the day of your order" : "at pickup"}.\n\nAfter you pay, take a screenshot of the Zelle confirmation and upload it on your order page in the app.`;
}

// one listener for every tap
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  if (el.dataset.a === "backdrop" && e.target.closest("[data-stop]")) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset.x, el.dataset.y); }
});
// typing updates drafts without redrawing (keeps the cursor in place)
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k) return;
  let v = e.target.value;
  if (k === "phone") { const pos = v.length; v = phoneFmt(v); e.target.value = v; draft.phone = v.replace(/\D/g, ""); document.querySelectorAll('[data-enable="phone"]').forEach((btn) => (btn.disabled = draft.phone.length !== 10)); return; }
  if (k === "code") { v = v.replace(/\D/g, "").slice(0, 6); e.target.value = v; draft.code = v; if (v.length === 6) A.verify(); return; }
  draft[k] = v;
  if (k.startsWith("mnote:")) { const btn = document.querySelector('[data-a="multiadd"]'); if (btn && S.ui.sheet && S.ui.sheet.type === "multi") btn.disabled = !multiReady(S.ui.sheet); }
  if (k === "note") { const btn = document.querySelector('[data-a="adddish"]'); if (btn && btn.dataset.needNote === "1") btn.disabled = !v.trim(); }
  if (k === "addr" && S.ui.sheet && S.ui.sheet.addr) { /* address changed: needs a fresh check */ }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.dataset) return;
  if (e.target.dataset.in === "addr") { e.preventDefault(); A.checkaddr(); }
  if (e.target.dataset.in === "phone") { e.preventDefault(); A.sendcode(); }
});
// Zelle screenshot upload
document.addEventListener("change", (e) => {
  const id = e.target.dataset && e.target.dataset.file;
  if (!id || !e.target.files || !e.target.files[0]) return;
  const o = S.orders.find((q) => q.id === id);
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"), s = Math.min(1, 320 / Math.max(img.width, img.height));
      c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      o.payment.shot = c.toDataURL("image/jpeg", 0.7); finishProof(o);
    };
    img.onerror = () => finishProof(o);
    img.src = reader.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});
function finishProof(o) {
  o.payment.state = "review"; o.payment.proofs = (o.payment.proofs || 0) + 1;
  setStatus(o, "Deposit Under Review", "deposit_review");
  tell(`Thanks! We received your payment screenshot for order ${o.id}. Chef will confirm the deposit shortly and you'll get a payment acknowledgement here.`, { orderId: o.id });
  render();
}

render(true);
})();
</script>
