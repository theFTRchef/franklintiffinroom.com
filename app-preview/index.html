<style>
/* Layout: an iPhone-sized frame running the FTR app on the left, the chef's WhatsApp side on the right; stacks on narrow screens.
   Brand: the FTR catering flyers - cream paper, forest green, chili red, marigold gold; Fraunces / Josefin Sans / Outfit. */
:root {
  --bg: #efe6d3; --page: #fffbf3; --surface: #ffffff; --surface2: #f6eedd; --line: #e8dcc4;
  --ink: #1e3a27; --muted: #4a5a4e; --red: #c8463f; --forest: #1e3a27; --cream: #fff6e6;
  --leaf: #1e3a27; --leaf-ink: #fff6e6; --leaf-soft: #e6ede4;
  --tur: #f2c14e; --tur-line: #e3a72f; --tur-soft: #fbefd0; --tur-ink: #7a5200; --chili: #c8463f; --chili-soft: #f8ddd6; --bad: #b23a2c; --veg: #2e7d3a;
  --frame: #1e3a27; --wa: #f7f0e1; --wa-bubble: #ffffff;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-logo: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --f-body: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b120e; --page: #111a14; --surface: #18241c; --surface2: #213027; --line: #2f3f34;
  --ink: #fff6e6; --muted: #b3bcaf; --red: #e8675e; --leaf: #f2c14e; --leaf-ink: #1e3a27; --leaf-soft: #22362a;
  --tur-soft: #3a2f14; --tur-ink: #f6d38a; --chili: #e8675e; --chili-soft: #43231d; --bad: #f08a7c; --veg: #6cc196;
  --frame: #000000; --wa: #141e18; --wa-bubble: #1c2a21; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b120e; --page: #111a14; --surface: #18241c; --surface2: #213027; --line: #2f3f34;
  --ink: #fff6e6; --muted: #b3bcaf; --red: #e8675e; --leaf: #f2c14e; --leaf-ink: #1e3a27; --leaf-soft: #22362a;
  --tur-soft: #3a2f14; --tur-ink: #f6d38a; --chili: #e8675e; --chili-soft: #43231d; --bad: #f08a7c; --veg: #6cc196;
  --frame: #000000; --wa: #141e18; --wa-bubble: #1c2a21; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; margin-bottom: 18px; }
.intro h1 { font: 700 28px/1.1 var(--f-display); margin: 0; text-wrap: balance; }
.intro p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.stage { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* phone */
.phone { width: 100%; max-width: 400px; margin: 0 auto; background: var(--frame); border-radius: 54px; padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.screen { position: relative; height: 820px; max-height: calc(100vh - 60px); min-height: 640px; border-radius: 43px; overflow: hidden; background: var(--page); display: flex; flex-direction: column; }
.status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 34px; font-weight: 700; font-size: 14px; background: var(--page); position: relative; z-index: 3; }
.island { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 112px; height: 30px; border-radius: 20px; background: #000; }
.nav { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; background: var(--page); border-bottom: 1px solid transparent; }
.nav .title { flex: 1; text-align: center; font-weight: 700; font-size: 16px; }
.nav .side { min-width: 64px; display: flex; }
.nav .side.r { justify-content: flex-end; }
.link { background: none; border: 0; padding: 6px 0; color: var(--leaf); font-weight: 600; }
.body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 0 22px; }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--leaf); }
.badge { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--chili); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }

.mark { width: 28px; height: 28px; border-radius: 24%; flex: none; background: var(--forest); color: var(--cream); font: 700 11px/1 var(--f-logo); letter-spacing: .5px; display: grid; place-items: center; position: relative; padding-top: 7px; }
.mark::before { content: "FTR"; }
.mark::after { content: ""; position: absolute; top: 15%; right: 14%; width: 30%; height: 16%; border-top: 2px solid #e8675e; border-right: 2px solid #e8675e; }
.logo { display: inline-flex; flex-direction: column; align-items: center; gap: calc(var(--s) * .13); --s: 32px; }
.logo .fr { font: 600 var(--s)/1 var(--f-logo); letter-spacing: calc(var(--s) * .065); color: var(--red); border-top: calc(var(--s) * .11) solid var(--red); border-right: calc(var(--s) * .11) solid var(--red); padding: calc(var(--s) * .13) calc(var(--s) * .26) 0 0; }
.logo .tr { background: var(--forest); color: var(--cream); font: 700 calc(var(--s) * .48)/1 var(--f-logo); letter-spacing: calc(var(--s) * .045); padding: calc(var(--s) * .15) calc(var(--s) * .39) calc(var(--s) * .09); border-radius: calc(var(--s) * .22); }
.tagline { font: italic 600 17px/1.25 var(--f-display); color: var(--red); text-wrap: balance; }
.veg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.veg i { width: 18px; height: 18px; border: 2px solid var(--veg); border-radius: 3px; display: grid; place-items: center; }
.veg i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--veg); }
.pad { padding: 0 20px; }
.h-big { font: 700 31px/1.1 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.h-sec { font: 700 24px/1.15 var(--f-display); margin: 0; color: var(--red); }
.h-card { font: 700 19px/1.2 var(--f-display); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

.dates { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
.dcard { flex: none; width: 168px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.dcard b { display: block; }
.dish { width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 20px; }
.dish .t { font: 700 18px/1.2 var(--f-display); }
.dish .d { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dish .p { margin-left: auto; text-align: right; font-weight: 700; white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--leaf-soft); color: var(--leaf); }
.lds { margin: 0 16px; padding: 18px; border-radius: 20px; background: var(--tur); border: 2px solid var(--tur-line); color: #1e3a27; display: flex; flex-direction: column; gap: 10px; }
.lds .flag { color: #c8463f; font-weight: 700; font-size: 13px; letter-spacing: 1.5px; }
.lds .btn { background: #1e3a27; color: #fff6e6; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.notice { display: flex; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--leaf-soft); font-size: 14px; }
.notice.warn { background: var(--tur-soft); }
.notice.bad { background: var(--chili-soft); }
.notice::before { content: "i"; flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--leaf); color: var(--leaf-ink); }
.notice.warn::before { content: "!"; background: var(--tur); color: #1e3a27; }
.notice.bad::before { content: "!"; background: var(--bad); color: #fff; }

.btn { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--leaf); color: var(--leaf-ink); font-weight: 700; font-size: 16px; padding: 0 16px; }
.btn.tur { background: var(--tur); color: #1e3a27; }
.btn.soft { background: var(--leaf-soft); color: var(--leaf); font-weight: 600; min-height: 46px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: scale(.98); }
.cartbar { flex: none; padding: 8px 16px; background: var(--page); border-top: 1px solid var(--line); }
.cartbar .btn { display: flex; justify-content: space-between; align-items: center; }
.field { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
textarea.field { resize: vertical; min-height: 64px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface2); border-radius: 99px; }
.stepper button { width: 38px; height: 38px; border: 0; background: none; color: var(--leaf); font-size: 20px; font-weight: 700; }
.stepper button:disabled { color: var(--muted); opacity: .4; }
.stepper span { min-width: 34px; text-align: center; font-weight: 700; font-size: 17px; }
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 6px; text-align: center; }
.opt.on { background: var(--leaf); color: var(--leaf-ink); border-color: transparent; }
.opt b { display: block; font: 700 22px/1 var(--f-display); }
.datechips { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.datechips .opt { flex: none; width: 90px; }
.datechips .opt b { font-size: 17px; margin-top: 2px; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.choice.on { border-color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
.radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 1px; }
.choice.on .radio { border-color: var(--leaf); background: radial-gradient(circle, var(--leaf) 0 45%, transparent 50%); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
.switch { flex: none; width: 50px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
.switch.on { background: var(--leaf); }
.switch.on::after { left: 23px; }
.line { display: flex; gap: 10px; align-items: baseline; }
.line .r { margin-left: auto; white-space: nowrap; }
.pill { display: inline-block; white-space: nowrap; flex: none; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.pill.act { background: var(--tur-soft); color: var(--tur-ink); }
.pill.good { background: var(--leaf-soft); color: var(--leaf); }
.pill.bad { background: var(--chili-soft); color: var(--bad); }
.ocard { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.ocard.act { border-color: var(--tur); }
iframe.kitchen { flex: 1; width: 100%; border: 0; background: var(--page); }
.tile { flex: none; width: 50px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; align-items: center; }
.tile b { width: 100%; text-align: center; background: var(--red); color: #fff6e6; font-size: 11px; font-weight: 700; padding: 3px 0; }
.tile span { font: 700 22px/1.1 var(--f-display); padding-top: 2px; }
.tile i { font-style: normal; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.copyrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--surface2); border-radius: 12px; padding: 10px 12px; }
.copyrow .v { font-weight: 700; word-break: break-all; }
.big-money { font: 700 34px/1 var(--f-display); }
.bubble { display: flex; gap: 10px; align-items: flex-start; }
.bubble .b { flex: 1; min-width: 0; background: var(--surface); border-radius: 4px 18px 18px 18px; padding: 12px 14px; white-space: pre-wrap; word-wrap: break-word; }
.bubble.unread .b { background: var(--leaf-soft); }
.pstep { display: flex; gap: 12px; align-items: flex-start; }
.pnum { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--forest); color: var(--cream); display: grid; place-items: center; font: 700 15px/1 var(--f-logo); padding-top: 2px; }
.zqr { display: block; width: 200px; max-width: 100%; margin: 0; border-radius: 10px; background: #fff; padding: 6px; image-rendering: pixelated; }
.qr { width: 150px; height: 150px; margin: 0 auto; border-radius: 10px; background: var(--surface2); display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--muted); padding: 10px; }

/* tiffin progress */
.tiffin { display: flex; gap: 18px; align-items: flex-end; }

.handle { width: 46px; height: 20px; border: 4px solid color-mix(in srgb, var(--muted) 55%, transparent); border-bottom: 0; border-radius: 12px 12px 0 0; }
.tier { width: 72px; height: 34px; border-radius: 9px; background: linear-gradient(90deg, var(--surface2), var(--line), var(--surface2)); position: relative; }
.tier::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); }
.tier.full::after { content: ""; position: absolute; inset: 4px; border-radius: 6px; background: var(--tur); box-shadow: inset 0 0 0 1px var(--tur-line); }
.tier.closed::after { background: var(--chili); }
.tier.now { outline: 2px dashed var(--tur); outline-offset: -1px; }
.base { width: 84px; height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--muted) 35%, transparent); }
.steps { flex: 1; display: flex; flex-direction: column; padding-bottom: 13px; }

.steps div.done { color: var(--ink); font-weight: 700; }
.steps div.now { color: var(--tur-ink); font-weight: 700; }

/* sheets */
.sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 5; display: flex; align-items: flex-end; }
.sheet-back.anim { animation: fade .18s ease-out; }
.sheet { width: 100%; height: calc(100% - 54px); background: var(--page); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.anim .sheet { animation: up .24s ease-out; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 0; flex: none; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
@keyframes fade { from { opacity: 0; } }
.sms { position: absolute; left: 10px; right: 10px; top: 52px; z-index: 9; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: drop .3s ease-out; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }

/* chef side */
.chef { background: var(--wa); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chef-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.chef-head h2 { font: 700 21px/1.2 var(--f-display); margin: 0; flex: 1; min-width: 200px; }
.chef .msg .chatlog { white-space: normal; display: grid; gap: 4px; margin: 8px 0 2px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.04); font-size: 14px; }
.cbub { display: grid; gap: 2px; max-width: 82%; }
.cbub .t { padding: 8px 12px; border-radius: 14px; background: var(--surface, #fff); border: 1px solid var(--line); }
.cbub.me { justify-self: end; text-align: right; }
.cbub.me .t { background: var(--leaf); color: var(--leaf-ink, #fff6e6); border-color: transparent; text-align: left; }
.chef .msg { background: var(--wa-bubble); border-radius: 4px 16px 16px 16px; padding: 12px 14px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.chef .msg .hd { font-weight: 700; margin-bottom: 4px; }
.chef .btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; margin-top: 10px; border-top: 1px solid var(--line); background: var(--line); border-radius: 0 0 12px 12px; overflow: hidden; }
.chef .btns button { border: 0; background: var(--wa-bubble); color: var(--leaf); font-weight: 700; padding: 10px; }
.chef .inline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chef .inline input { flex: 1; min-width: 120px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.chef .inline button { border: 0; border-radius: 10px; background: var(--leaf); color: var(--leaf-ink); font-weight: 700; padding: 9px 14px; }
.chef .when { font-size: 12px; color: var(--muted); margin-top: 6px; }
.empty { color: var(--muted); padding: 10px 2px; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.log { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow: auto; }
.sheetrow { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.sheetrow table { border-collapse: collapse; font-size: 12.5px; min-width: 720px; width: 100%; }
.sheetrow th, .sheetrow td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.sheetrow th { background: var(--surface2); font-weight: 700; }
details.howto summary { cursor: pointer; font-weight: 700; }
</style>
</head>
<body>


<div class="wrap">
  <div class="intro">
    <div>
      <div class="row" style="gap:14px;align-items:center"><span class="logo" style="--s:22px"><span class="fr">FRANKLIN</span><span class="tr">TIFFIN ROOM</span></span><h1>App Simulator</h1></div>
      <p>A browser replica of the iPhone app with your menu and ordering rules. Order as a customer on the left, then answer as Chef on the right, exactly as you would on WhatsApp. Nothing here reaches your real bot, Sheet or customers.</p>

  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>

  </div>
</div>

// ------------------------------------------------------------------ dates & time helpers
function todayISO() { return new Date().toLocaleDateString("en-CA", { timeZone: TZ }); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function dow(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
function dateLabel(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }); }
function t12(t) { const [h, m] = t.split(":").map(Number); return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + (h >= 12 ? " PM" : " AM"); }
function tShort(t) { return t12(t).replace(":00 ", " "); }
function mins(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function hhmm(n) { return String(Math.floor(n / 60) % 24).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0"); }

function baseDates() {
  let sat = todayISO();
  while (dow(sat) !== 6) sat = addDays(sat, 1);
  return [sat, addDays(sat, 1), addDays(sat, 7), addDays(sat, 8)];
}
function chefDates() {
  return baseDates().map((date, i) => {
    const t = S.days[i];
    return { date, pickupAM: t.am, pickupPM: t.pm, catering: t.delivery && !S.settings.pickupOnly ? [{ start: "12:00", end: "18:00" }] : [], liveDose: SESSIONS.filter((w, k) => t[k ? "ldsE" : "ldsL"]).map((w) => ({ ...w })) };
  }).filter((d) => d.pickupAM || d.pickupPM || d.catering.length || d.liveDose.length);
}
function summary(d) {
  const parts = [], p = [];
  if (d.pickupAM) p.push("11:30 AM");
  if (d.pickupPM) p.push("6:30 PM");
  if (p.length) parts.push("Catering pickup " + p.join(" or "));
  if (d.catering.length) parts.push("Catering delivery " + d.catering.map((w) => tShort(w.start) + "-" + tShort(w.end)).join(", "));
  if (d.liveDose.length) parts.push("LIVE Dose " + d.liveDose.map((w) => tShort(w.start) + "-" + tShort(w.end)).join(", "));
  return parts.join(" · ");
}
function ldsMinutes(total) { return LDS.setupMinutes + (LDS.servingMinutesByTotal[total] || Math.round(total * 0.6)) + LDS.closeoutMinutes; }
function slotsFor(d, kind, plates, ful) {
  if (kind === "lds") {
    // The standard on-site sessions open that day.
    return d.liveDose.map((w) => ({ id: "slot:" + w.start + "-" + w.end, title: t12(w.start) + " - " + t12(w.end), sub: w.label + " session - on-site serving time" }));
  }
  const out = [];
  if (ful === "delivery") {
    d.catering.forEach((w) => { for (let s = mins(w.start); s + 180 <= mins(w.end); s += 180) out.push({ id: "slot:" + hhmm(s) + "-" + hhmm(s + 180), title: t12(hhmm(s)) + " - " + t12(hhmm(s + 180)) }); });
    return out;
  }
  if (d.pickupAM) out.push({ id: "slot:pickup-am", title: "Pickup by 11:30 AM", sub: "Lunch order" });
  if (d.pickupPM) out.push({ id: "slot:pickup-pm", title: "Pickup by 6:30 PM", sub: "Dinner order" });
  return out;
}
function ldsSchedule(start, total) {
  const s = mins(start), first = s + LDS.setupMinutes, last = first + (LDS.servingMinutesByTotal[total] || Math.round(total * 0.6)), wrap = last + LDS.closeoutMinutes;
  return { arrival: t12(start), firstDose: t12(hhmm(first)), lastDose: t12(hhmm(last)), wrapUp: t12(hhmm(wrap)) };
}
function travelFee(miles) { if (miles == null) return null; if (miles <= LDS.travelFreeMiles) return 0; return Math.ceil((miles - LDS.travelFreeMiles) / LDS.travelBlockMiles) * LDS.travelFeePerBlock; }

// Zelle deposit deadline (same rule as payments.js): catering 48h before the day; LIVE Dose 10 AM three days before.
function deadlineFor(order) {
  const [y, m, d] = order.eventDate.split("-").map(Number);
  let t;
  if (order.type === "lds") t = new Date(Date.UTC(y, m - 1, d - 3, 15, 0)); // 10:00 ET (EST)
  else t = new Date(Date.UTC(y, m - 1, d - 2, 5, 0) - 60000); // 11:59 PM ET the night before
  const min = Date.now() + 2 * 3600000;
  return new Date(Math.max(t.getTime(), min));
}
function deadlineLabel(dt) { return new Date(dt).toLocaleString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }

function phoneFmt(d) { d = String(d).replace(/\D/g, "").slice(0, 10); if (!d) return ""; if (d.length <= 3) return "(" + d; if (d.length <= 6) return "(" + d.slice(0, 3) + ") " + d.slice(3); return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6); }

const TAGS = [

function classify(text, header) {

/** Same rules as the bot: "12:30 PM", "6:30 PM - 8:30 PM", optional "11/8" first. */
function parseChefTime(text, o) {
  const re = /(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s?m\.?|\bnoon\b/gi, ts = [];

  while ((m = re.exec(raw))) { if (/noon/i.test(m[0])) { ts.push("12:00"); continue; } let h = +m[1] % 12; if (m[3].toLowerCase() === "p") h += 12; ts.push(String(h).padStart(2, "0") + ":" + (m[2] || "00")); }
  if (!ts.length) return null;
  const dm = /(\d{1,2})[\/-](\d{1,2})/.exec(raw.replace(re, " "));
  let day = o.eventDate;
  if (dm) { const y = +o.eventDate.slice(0, 4); day = `${y}-${String(+dm[1]).padStart(2, "0")}-${String(+dm[2]).padStart(2, "0")}`; o.eventDate = day; }
  const dl = dateLabel(day) + ", ";
  if (o.type === "lds") {
    let end = ts[1];
    if (!end) { const r = /(\d{1,2}:\d{2} [AP]M) - (\d{1,2}:\d{2} [AP]M)/.exec(o.requestedTime || ""); const to24 = (l) => { const q = /(\d+):(\d+) ([AP])/.exec(l); let h = +q[1] % 12; if (q[3] === "P") h += 12; return h * 60 + +q[2]; }; const len = r ? to24(r[2]) - to24(r[1]) : 120; end = hhmm(mins(ts[0]) + (len > 0 ? len : 120)); }
    return `${dl}LIVE Dose serving ${t12(ts[0])} - ${t12(end)}`;
  }

}

function chefLog(text) { S.chefLog.unshift(stamp() + " · " + text); }
function sheetRow(o) {
  const items = o.type === "custom" ? "CUSTOM REQUEST: " + o.request : o.lines.map((l) => l.kind === "lds" ? `LIVE Dose Station: ${l.detail}${l.travelFee ? ` (+$${l.travelFee.toFixed(2)} travel)` : ""}${l.extFee ? ` (+$${l.extFee.toFixed(2)} for ${EXT.minutes} extra min)` : ""}${l.note ? ` (note: ${l.note})` : ""}` : `${l.qtyLabel || l.qty}x ${l.title}${l.qty % 1 ? " (half tray)" : ""}${l.note ? ` (note: ${l.note})` : ""}`).join("; ");
  const row = S.sheet.find((r) => r.id === o.id);
  const data = { id: o.id, ts: o.createdAt, name: S.user ? S.user.first + " " + S.user.last : "", phone: S.user ? "1" + S.user.phone : "", items, subtotal: o.subtotal.toFixed(2), fulfillment: o.fulfillment || "custom", address: o.address || "", time: o.requestedTime || "", status: o.status, payment: payText(o) };
  if (row) Object.assign(row, data); else S.sheet.unshift(data);
}
function payText(o) {
  const p = o.payment; if (!p) return "";
  if (p.state === "paid") return `Deposit ${money(p.depositDue, true)} PAID; balance ${money(p.balance, true)}`;
  if (p.state === "review") return `Deposit ${money(p.depositDue, true)} - screenshot received, chef to confirm`;
  return `Deposit ${money(p.depositDue, true)} due by ${deadlineLabel(p.deadline)}`;
}
function setStatus(o, status, stage) { o.status = status; o.stage = stage; sheetRow(o); }

// ------------------------------------------------------------------ navigation
function cur() { const st = S.ui.stack[S.ui.tab]; return st[st.length - 1] || null; }
function push(screen, params) { S.ui.stack[S.ui.tab].push({ screen, ...(params || {}) }); render(true); }
function pop() { S.ui.stack[S.ui.tab].pop(); render(true); }
function openSheet(type, params) { animNext = true; S.ui.sheet = { type, view: params && params.view || null, ...(params || {}) }; render(true); }
function closeSheet() { S.ui.sheet = null; render(true); }

// ------------------------------------------------------------------ screens
function navBar(title, left, right) {
  return `<div class="nav"><div class="side">${left || ""}</div><div class="title">${title || ""}</div><div class="side r">${right || ""}</div></div>`;
}
const LOGO = (s) => `<span class="logo" style="--s:${s}px" role="img" aria-label="Franklin Tiffin Room"><span class="fr">FRANKLIN</span><span class="tr">TIFFIN ROOM</span></span>`;
const back = (label) => `<button class="link" data-a="pop">‹ ${esc(label || "Back")}</button>`;

function menuScreen() {
  const dates = chefDates();
  const rows = CAT.items.map((d) => {
    const n = S.cart.lines.filter((l) => l.id === d.id).reduce((s, l) => s + l.qty, 0);
    const meta = [d.size, d.servesMin > 1 ? `Serves ${d.servesMin}${d.servesMax > d.servesMin ? "–" + d.servesMax : ""}` : ""].filter(Boolean).join(" · ");
    const sel = S.ui.selecting, on = sel && S.ui.picked.includes(d.id);
    return `<button class="dish" data-a="${sel ? "pick" : "dish"}" data-x="${d.id}" ${sel ? `aria-pressed="${on}"` : ""}>${sel ? `<span class="radio" style="align-self:center;${on ? "border-color:var(--leaf);background:radial-gradient(circle,var(--leaf) 0 45%,transparent 50%)" : ""}"></span>` : ""}<div style="min-width:0"><div class="t">${esc(d.title)}</div>${meta ? `<div class="small muted">${esc(meta)}</div>` : ""}<div class="d">${esc(d.description)}</div></div><div class="p num">${money(d.price)}${n ? `<div><span class="chip">${n} in order</span></div>` : ""}</div></button>`;
  }).join("");
  return navBar("", `<button class="link" data-a="selectmode">${S.ui.selecting ? "Cancel" : "Select dishes"}</button>`, "") +
  `<div class="body"><div class="stack" style="gap:0;padding-bottom:24px">
    <div class="pad stack" style="padding-top:6px;padding-bottom:20px;gap:8px;align-items:center;text-align:center">${LOGO(34)}<div class="tagline">Bringing back the OG flavor of Masala Dose</div><div class="stack" style="gap:6px;align-items:center"><span style="font:italic 600 16px var(--f-display)">Multi Cuisine Personal Chef in Somerset, NJ</span><span class="veg"><i></i>100% Vegetarian</span></div></div>
    <div class="lds" style="margin-bottom:26px">
      <span class="flag">★ Our flagship</span>
      <div style="font:700 25px/1.15 var(--f-display)">Live on-site Masala Dose</div>
      <div>${LDS.mdTitle} and ${LDS.odTitle}, made fresh on the griddle at your event. 100, 150 or 200 dose.</div>
      <div><b class="num" style="font-size:18px">From ${money(ldsPrice(LDS.minTotal))}</b> <span class="small">incl. ${money(LDS.setupFee)} setup</span></div>
      <button class="btn" data-a="lds" ${dates.some((d) => d.liveDose.length) ? "" : "disabled"}>${S.cart.lds ? "Change your station" : "Plan your station"}</button>
      ${dates.some((d) => d.liveDose.length) ? "" : `<div class="small">No LIVE Dose dates open right now.</div>`}
    </div>
    <div class="pad small muted" style="font-weight:600;margin-bottom:8px">Chef's open dates</div>
    <div class="dates">${dates.map((d) => `<div class="dcard"><b>${dateLabel(d.date)}</b><span class="small muted">${summary(d)}</span></div>`).join("")}</div>
    <div class="pad" style="margin-top:26px"><h3 class="h-sec">${esc(CAT.title)}</h3><div class="muted small" style="margin:4px 0 6px">${esc(CAT.subtitle)}</div><div class="small muted">${S.settings.pickupOnly ? "Trays for pickup from our kitchen" : "Pickup or delivery"} · ${HALF() ? "full or half trays" : "full trays"}</div><div hidden>Trays for pickup from our kitchen · full trays</div></div>
    <div>${rows}</div>
    <div class="pad" style="margin-top:28px"><div class="panel"><div class="h-card">Something else in mind?</div><div class="muted">North Indian, Asian fusion, Italian or Mexican vegetarian - tell Chef what you need and get a price.</div><button class="btn soft" data-a="compose" data-x="custom">Ask for a custom quote</button></div></div>
  </div></div>` +
  (S.ui.selecting ? `<div class="cartbar"><button class="btn" data-a="multi" ${S.ui.picked.length ? "" : "disabled"} style="display:flex;justify-content:space-between;align-items:center"><span>${S.ui.picked.length ? S.ui.picked.length + " selected" : "Tap dishes to select them"}</span>${S.ui.picked.length ? "<span>Choose quantities</span>" : ""}</button></div>` : "") +
  (!S.ui.selecting && cartCount() ? `<div class="cartbar"><button class="btn" data-a="cart"><span>${S.cart.lds ? "LIVE Dose Station" : cartCount() + " dish" + (cartCount() === 1 ? "" : "es")}</span><span class="num">View order · ${money(cartTotal())}</span></button></div>` : "");
}

function gate(reason) {
  return `<div class="body"><div class="stack pad" style="align-items:center;text-align:center;padding-top:120px;gap:18px">${LOGO(30)}<div style="font-size:17px;max-width:30ch">${reason}</div><button class="btn" data-a="signin">Sign in with your phone number</button></div></div>`;
}

function ordersScreen() {
  const top = cur();
  if (top && top.screen === "order") return orderDetail(top.id);
  if (!S.user) return navBar("Orders") + gate("Sign in to see your orders, deposits and Chef's replies.");
  if (!S.orders.length) return navBar("Orders") + `<div class="body"><div class="stack pad" style="text-align:center;padding-top:100px"><div class="h-sec">No orders yet</div><div class="muted">When you send an order, you'll follow it here - from Chef's approval to your deposit and pickup.</div><button class="btn soft" data-a="tab" data-x="menu">Browse the menu</button></div></div>`;
  const card = (o) => {
    const [y, m, d] = dayKey(o).split("-").map(Number), dt = new Date(Date.UTC(y, m - 1, d));
    const f = (opt) => dt.toLocaleDateString("en-US", { ...opt, timeZone: "UTC" });
    return `<button class="ocard ${needsYou(o) ? "act" : ""}" data-a="order" data-x="${o.id}"><div class="row" style="align-items:flex-start;gap:14px"><span class="tile" aria-hidden="true"><b>${f({ month: "short" })}</b><span>${d}</span><i>${f({ weekday: "short" })}</i></span><div class="stack" style="gap:6px;flex:1;min-width:0"><div class="spread"><b class="h-card" style="font-size:17px">${esc(o.title)}</b>${pill(o)}</div><div class="small muted">${esc(o.requestedTime || o.request || "")}</div><div class="spread small muted"><span>${o.id}</span>${o.subtotal ? `<b class="num" style="color:var(--ink);font-size:15px">${money(o.subtotal, true)}</b>` : ""}</div></div></div></button>`;
  };
  // By date: what needs the customer, booked events ahead (soonest first), past orders by month (newest first).
  const today = todayISO();
  const act = S.orders.filter(needsYou).sort((a, b) => dayKey(a).localeCompare(dayKey(b)));
  const rest = S.orders.filter((o) => !needsYou(o));
  const upcoming = rest.filter((o) => o.stage !== "closed" && (o.eventDate ? o.eventDate >= today : o.stage !== "confirmed")).sort((a, b) => dayKey(a).localeCompare(dayKey(b)));
  const past = rest.filter((o) => !upcoming.includes(o)).sort((a, b) => dayKey(b).localeCompare(dayKey(a)));
  const months = [];
  past.forEach((o) => {
    const [y, m] = dayKey(o).split("-").map(Number);
    const label = new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    const last = months[months.length - 1];
    if (last && last.label === label) last.orders.push(o); else months.push({ label, orders: [o] });
  });
  const head = (t, c) => `<div class="h-sec" style="font-size:22px;margin-top:8px;color:${c}">${t}</div>`;
  return navBar("Orders") + `<div class="body"><div class="stack" style="padding:4px 16px 24px">
    ${act.length ? head("Needs you", "var(--tur-ink)") + act.map(card).join("") : ""}
    ${upcoming.length ? head("Upcoming", "var(--red)") + upcoming.map(card).join("") : ""}
    ${months.length ? head("Past orders", "var(--red)") + months.map((g) => `<b class="small muted" style="margin-top:4px">${g.label}</b>` + g.orders.map(card).join("")).join("") : ""}
  </div></div>`;
}
const dayKey = (o) => o.eventDate || o.createdDay || todayISO();

function pill(o) {
  const map = { review: ["With Chef", ""], quote_requested: ["Awaiting quote", ""], quote_ready: ["Quote ready", "act"], deposit_due: ["Deposit due", "act"], deposit_review: ["Checking deposit", ""], confirmed: ["Confirmed", "good"], closed: [o.status.includes("Released") ? "Released" : "Not booked", "bad"] };
  const [t, c] = map[o.stage] || ["With Chef", ""];
  return `<span class="pill ${c}">${t}</span>`;
}

function tiffin(o) {
  const steps = o.type === "custom" ? [["Request sent"], ["Chef's quote", o.quote ? money(o.quote.price) : ""]] : [["Sent to Chef"], ["Chef approves"]];
  if (o.payment || o.stage === "deposit_due" || o.stage === "deposit_review") steps.push(["Zelle deposit", o.payment ? money(o.payment.depositDue, true) : ""]);
  steps.push(["Booked", o.eventLabel || ""]);
  const filled = { review: 1, quote_requested: 1, quote_ready: 2, deposit_due: 2, deposit_review: 2, confirmed: steps.length, closed: 0 }[o.stage] ?? 1;
  const live = o.stage !== "confirmed" && o.stage !== "closed";
  const tiers = steps.map((s, i) => `<div class="tier ${i < filled ? "full" : ""} ${o.stage === "closed" ? "closed" : ""} ${live && i === filled ? "now" : ""}"></div>`).reverse().join("");
  const labels = steps.map((s, i) => `<div class="${i < filled ? "done" : live && i === filled ? "now" : ""}"><span>${s[0]}</span><span class="small muted num">${s[1] || ""}</span></div>`).reverse().join("");
  return `<div class="tiffin" role="img" aria-label="Order progress"><div class="carrier"><div class="handle"></div>${tiers}<div class="base"></div></div><div class="steps">${labels}</div></div>`;
}

function orderDetail(id) {
  const o = S.orders.find((x) => x.id === id);
  if (!o) return navBar("", back("Orders")) + `<div class="body"></div>`;
  const p = o.payment;
  let action = "";
  if (o.quote && o.stage === "quote_ready") {
    action = `<div class="panel"><div class="h-card">Chef's quote</div><div class="big-money num">${money(o.quote.price)}</div>${o.quote.comment ? `<div>“${esc(o.quote.comment)}”</div>` : ""}<div class="small muted">Your request: ${esc(o.request)}</div><div class="row"><button class="btn soft" data-a="quote" data-x="${o.id}" data-y="no">Decline</button><button class="btn" data-a="quote" data-x="${o.id}" data-y="yes">Accept quote</button></div></div>`;
  }
  if (p && (p.state === "awaiting" || p.state === "review")) {
    const step = (n, title, body) => `<div class="pstep"><span class="pnum">${n}</span><div class="stack" style="gap:8px;min-width:0;flex:1"><b>${title}</b>${body}</div></div>`;
    action += `<div class="panel" style="gap:16px"><div class="h-card">${p.state === "review" ? "Confirmation received" : "Pay your deposit by Zelle"}</div>
      ${p.state === "review" ? `<div class="notice">Thanks - we have your payment confirmation. Chef will check the payment and confirm your deposit here.</div>` : ""}
      <div class="spread"><span class="big-money num">${money(p.depositDue, true)}</span><span style="text-align:right"><span class="small muted">Pay by</span><br><b style="color:var(--tur-ink)">${deadlineLabel(p.deadline)}</b></span></div>
      ${step(1, `Scan this code to pay ${money(p.depositDue, true)}`, `<div class="small muted">Open your bank app, choose Zelle, and scan the code. Put <b>${o.id}</b> in the memo.</div>
        <img class="zqr" src="${ZELLE_QR}" alt="Zelle QR code for Franklin Tiffin Room - scan with your bank app">
        <div class="small muted">Can't scan? Send it by Zelle to:</div>
        <button class="copyrow" data-a="copy" data-x="${esc(ST.payment.zelleTo)}"><span style="flex:1"><span class="small muted">Send to</span><br><span class="v">${esc(ST.payment.zelleTo)}</span></span><span class="small" style="color:var(--leaf)">Copy</span></button>
        <button class="copyrow" data-a="copy" data-x="${o.id}"><span style="flex:1"><span class="small muted">Memo</span><br><span class="v">${o.id}</span></span><span class="small" style="color:var(--leaf)">Copy</span></button>`)}
      ${step(2, "Take a screenshot of the confirmation", `<div class="small muted">When your bank shows the payment as sent, take a screenshot of that confirmation screen.</div>`)}
      ${step(3, "Upload the screenshot here", `<div class="small muted">Chef checks it against the payment and confirms your deposit${p.state === "review" ? "" : " - that locks in your date"}.</div>
        <label class="btn" style="display:grid;place-items:center;cursor:pointer">${p.proofs ? "Upload another confirmation" : "Upload payment confirmation"}<input type="file" accept="image/*" data-file="${o.id}" hidden></label>`)}
      <div class="small muted">The balance of ${money(p.balance, true)} is due ${o.type === "lds" ? "on the day of your event" : o.type === "custom" ? "on the day of your order" : "at pickup"}.</div></div>`;
  }
  if (p && p.state === "paid") action += `<div class="notice">Deposit ${money(p.depositDue, true)} PAID; balance ${money(p.balance, true)}</div>`;
  const lines = o.lines.map((l) => `<div class="line"><div><b>${l.kind === "lds" ? l.title : (l.qtyLabel || l.qty) + " × " + esc(l.title)}</b>${l.kind === "lds" ? `<div class="small muted">${esc(l.detail)}</div>` : ""}${l.note ? `<div class="small muted">“${esc(l.note)}”</div>` : ""}</div><span class="r num">${money(l.total, true)}</span></div>`).join("");
  const closed = o.status.includes("Released") ? "This order was released because the deposit didn't arrive in time. Call Chef if you'd still like the date." : o.status.includes("Quote Declined") ? "You declined this quote." : "Chef isn't able to take this order. Please call to talk it through, or try another date.";
  return navBar(o.id, back("Orders")) + `<div class="body"><div class="stack" style="padding:8px 16px 28px;gap:20px">
    <div class="stack" style="gap:6px"><div>${pill(o)}</div><h2 class="h-big" style="font-size:27px">${esc(o.title)}</h2>${o.requestedTime ? `<div class="muted">${esc(o.stage === "review" && o.requestedTimeOriginal ? o.requestedTimeOriginal : o.requestedTime)}</div>` : ""}</div>
    ${o.timeChange && o.stage !== "review" ? `<div class="notice warn">Chef has set your time to ${esc(o.timeChange.to)}. You asked for ${esc(o.timeChange.from)}.</div>` : ""}
    ${S.chat === o.id || (o.chat || []).length ? `<div class="panel"><div class="spread"><div class="h-card">Messages with Chef</div>${S.chat === o.id ? `<span class="pill act">Chef is waiting</span>` : ""}</div>
      ${(o.chat || []).map((m) => `<div class="cbub ${m.from === "chef" ? "them" : "me"}"><span class="small muted">${m.from === "chef" ? "Chef" : "You"}</span><span class="t">${esc(m.text)}</span></div>`).join("")}
      ${S.chat === o.id ? `<div class="row"><input class="field" id="f-reply-${o.id}" data-in="reply:${o.id}" placeholder="Reply to Chef" value="${esc(draft["reply:" + o.id] || "")}"><button class="btn" style="flex:0 0 auto;width:auto;padding:0 18px" data-a="custreply" data-x="${o.id}">Send</button></div><div class="small muted">Chef gets this on WhatsApp right away.</div>` : `<div class="small muted">Chef has closed this chat. Use Ask a question in Account to message Chef.</div>`}</div>` : ""}
    ${o.stage === "closed" ? `<div class="notice bad">${closed}</div>` : tiffin(o)}
    ${action}
    <div class="panel"><div class="h-card">Details</div>${o.type === "custom" ? `<div>${esc(o.request)}</div>` : ""}${lines}${o.subtotal ? `<div class="line" style="border-top:1px solid var(--line);padding-top:10px"><b>Total</b><b class="r num">${money(o.subtotal, true)}</b></div>` : ""}${o.address ? `<div class="small">📍 ${esc(o.address)}</div>` : ""}${o.type === "catering" ? `<button class="btn soft" data-a="reorder" data-x="${o.id}">Order these again</button>` : ""}</div>
    <div class="small muted" style="text-align:center">Questions? Call Chef at ${esc(ST.phoneDisplay)}</div>
  </div></div>`;
}

function tagChip(m) {
  if (!m.tag || m.tag === "update") return "";
  const tone = ["approved", "paid"].includes(m.tag) ? "good" : ["declined", "released", "not_received"].includes(m.tag) ? "bad" : ["deposit_due", "quote", "chef_message"].includes(m.tag) ? "act" : "";
  return `<span class="pill ${tone}" style="margin-bottom:6px">${esc(m.tagLabel)}</span>\n`;
}
const FILTERS = { all: ["All", () => true], decisions: ["Approvals & declines", (m) => ["approved", "declined", "quote", "released"].includes(m.tag)], messages: ["Messages from Chef", (m) => m.tag === "chef_message"], payments: ["Payments", (m) => ["deposit_due", "paid", "not_received", "screenshot", "released"].includes(m.tag)] };
function messagesScreen() {
  if (!S.user) return navBar("Notifications") + gate("Sign in to get Chef's approvals, deposit requests and updates about your orders.");
  if (!S.inbox.length) return navBar("Notifications") + `<div class="body"><div class="stack pad" style="text-align:center;padding-top:100px"><div class="h-sec">No notifications yet</div><div class="muted">Chef's approvals, deposit requests and updates about your orders will show up here.</div></div></div>`;
  const f = S.ui.filter || "all";
  S.inbox.forEach((m) => { if (!m.tag) Object.assign(m, classify(m.text, m.header)); });
  const chips = `<div class="row" style="gap:8px;overflow-x:auto;scrollbar-width:none">${Object.entries(FILTERS).map(([k, [label]]) => `<button class="opt ${f === k ? "on" : ""}" style="flex:none;padding:7px 12px;border-radius:99px;font-weight:600;font-size:13.5px" data-a="filter" data-x="${k}" aria-pressed="${f === k}">${label}</button>`).join("")}</div>`;
  const items = S.inbox.filter((m) => FILTERS[f][1](m)).map((m) => {
    const o = m.orderId && S.orders.find((x) => x.id === m.orderId);
    const actions = m.quoteFor && o && o.stage === "quote_ready" ? `<div class="row" style="margin-top:10px"><button class="btn soft" data-a="quote" data-x="${m.quoteFor}" data-y="no">Decline</button><button class="btn" data-a="quote" data-x="${m.quoteFor}" data-y="yes">Accept</button></div>` : "";
    return `<div class="bubble ${m.read ? "" : "unread"}"><span class="mark"></span><div class="b">${tagChip(m)}${m.header ? `<b>${esc(m.header)}</b>\n` : ""}${esc(m.text)}${actions}<div class="small muted" style="margin-top:8px;display:flex;justify-content:space-between"><span>${m.at}</span>${o ? `<button class="link small" data-a="goorder" data-x="${o.id}">${m.tag === "chef_message" && S.chat === o.id ? "Reply" : "View order"}</button>` : ""}</div></div></div>`;
  }).join("") || `<div class="muted">Nothing here yet.</div>`;
  return navBar("Notifications") + `<div class="body"><div class="stack" style="padding:8px 16px 24px;gap:14px">${chips}${items}</div></div>`;
}

function kitchenScreen() {
  return navBar("Chef's Kitchen", `<button class="link" data-a="pop">Done</button>`) + `<div class="body" style="overflow:hidden;display:flex;flex-direction:column"><div class="small" style="padding:6px 16px;background:var(--tur-soft);color:var(--tur-ink)">Your real admin page, in preview mode with sample orders. In the app it opens your live kitchen, already signed in.</div><iframe class="kitchen" src="kitchen.html" title="Chef's Kitchen - admin page"></iframe></div>`;
}
function accountScreen() {
  const u = S.user;
  const top = cur();
  if (top && top.screen === "kitchen") return kitchenScreen();
  return navBar("Account") + `<div class="body"><div class="stack" style="padding:8px 16px 28px;gap:18px">
    <button class="ocard" data-a="kitchen" style="flex-direction:row;align-items:center;gap:14px"><span class="mark" style="width:40px;height:40px;font-size:15px"></span><span class="stack" style="gap:2px;flex:1"><b class="h-card" style="font-size:18px">Chef's Kitchen</b><span class="small muted">Orders, approvals, menu, calendar and Setup - your admin page. Shows only on Chef's phone.</span></span><span class="muted">›</span></button>
    ${u ? `<div class="panel"><div class="h-card" style="font-size:22px">${esc(u.first)} ${esc(u.last)}</div><div class="muted num">${phoneFmt(u.phone)}</div>${u.address ? `<div class="small"><span class="muted">Saved address</span><br>${esc(u.address)}</div>` : ""}</div>`

    <div class="panel"><b class="small muted">How ordering works</b><div>Chef reviews every order and replies here. ${S.settings.deposit ? "A 50% Zelle deposit locks in your date: catering is due 2 days before the day of your order, and the LIVE Dose Station by 10:00 AM 3 days before the event." : "Payment is collected in person."}</div><div>${S.settings.pickupOnly ? "Catering trays are picked up from our kitchen." : "Catering trays can be picked up or delivered."} The LIVE Dose Station comes to you.</div></div>
    ${u ? `<div class="panel"><button class="link" style="text-align:left" data-a="signout">Sign out</button>${S.ui.confirmDelete ? `<div class="notice bad">Delete your account? You'll be signed out and your saved details removed.</div><div class="row"><button class="btn soft" data-a="nodelete">Keep it</button><button class="btn" style="background:var(--bad);color:#fff" data-a="delete">Delete</button></div>` : `<button class="link" style="text-align:left;color:var(--bad)" data-a="askdelete">Delete my account</button>`}<div class="small muted">Deleting removes your sign-in, saved name, address and messages. Order records are kept by Franklin Tiffin Room.</div></div>` : ""}
    <div class="small muted" style="text-align:center">Version 1.0 · simulator</div>
  </div></div>`;
}

// ------------------------------------------------------------------ sheets
function sheetHTML() {
  const sh = S.ui.sheet; if (!sh) return "";
  let inner = "";
  if (sh.type === "dish") inner = dishSheet(sh);
  if (sh.type === "lds") inner = ldsSheet(sh);
  if (sh.type === "cart") inner = sh.view === "checkout" ? checkoutSheet(sh) : sh.view === "placed" ? placedSheet(sh) : cartSheet();
  if (sh.type === "signin") inner = signinSheet(sh);
  if (sh.type === "compose") inner = composeSheet(sh);
  if (sh.type === "multi") inner = multiSheet(sh);
  const a = animNext; animNext = false;
  return `<div class="sheet-back${a ? " anim" : ""}" data-a="backdrop"><div class="sheet" data-stop="1"><div class="grab"></div>${inner}</div></div>`;
}
const close = (label) => `<button class="link" data-a="close">${label || "Close"}</button>`;
function stepper(name, val, min, max, step) {
  return `<span class="stepper" role="group" aria-label="Quantity"><button data-a="step" data-x="${name}" data-y="-${step}" ${val - step < min ? "disabled" : ""} aria-label="Less">−</button><span class="num">${qtyText(val)}</span><button data-a="step" data-x="${name}" data-y="${step}" ${val + step > max ? "disabled" : ""} aria-label="More">+</button></span>`;
}

  const noteOk = !d.requiresNote || (draft.note || "").trim();
  return navBar("", close()) + `<div class="body"><div class="stack" style="padding:6px 20px 24px;gap:18px">
    <div><h2 class="h-big">${esc(d.title)}</h2>${meta ? `<div class="muted" style="font-weight:600;margin-top:4px">${esc(meta)}</div>` : ""}</div>

}

function cartSheet() {

const ldsDetail = (l) => [l.md ? l.md + " Mysore Masale Dose" : "", l.total - l.md ? (l.total - l.md) + " Onion Dose" : ""].filter(Boolean).join(" + ");

function checkoutSheet(sh) {
  const isLDS = !!S.cart.lds, plates = isLDS ? S.cart.lds.total : 0;
  if (S.settings.pickupOnly) sh.ful = "pickup";
  const ful = isLDS ? "delivery" : sh.ful || "pickup";
  const needsAddr = isLDS || ful === "delivery";
  const dates = chefDates().map((d) => ({ ...d, slots: slotsFor(d, isLDS ? "lds" : "catering", plates, ful) })).filter((d) => d.slots.length);
  const date = dates.find((d) => d.date === sh.date), slot = date && date.slots.find((s) => s.id === sh.slot);
  const addr = sh.addr; // { status, match, miles, inRange }
  const addressReady = !needsAddr || (addr && ((addr.status === "match" && (addr.inRange || (isLDS && sh.askChef))) || (addr.status === "none" && sh.asTyped)));
  const ready = addressReady && slot && (isLDS || ful === "delivery" || !S.settings.pickupOnly || sh.agree);

  let sections = "";
  if (!isLDS && !S.settings.pickupOnly) sections += `<div class="stack"><div class="h-sec" style="font-size:22px">Pickup or delivery</div><div class="pick" style="grid-template-columns:1fr 1fr">${["pickup", "delivery"].map((k) => `<button class="opt ${ful === k ? "on" : ""}" data-a="ful" data-x="${k}" aria-pressed="${ful === k}" style="font-weight:700">${k === "pickup" ? "Pickup" : "Delivery"}</button>`).join("")}</div>${ful === "delivery" ? `<div class="small muted">A delivery fee based on distance is added when Chef confirms. We deliver within ${ST.delivery.maxMiles} miles.</div>` : ""}</div>`;
  if (!isLDS && S.settings.pickupOnly) sections += `<div class="stack"><div class="h-sec" style="font-size:22px">Pickup</div><div class="panel"><div>All catering orders are for pickup from our kitchen. Chef shares the pickup details when your order is confirmed.</div><div class="toggle"><span>I'll pick up my order</span><button class="switch ${sh.agree ? "on" : ""}" role="switch" aria-checked="${!!sh.agree}" data-a="flag" data-x="agree" aria-label="I'll pick up my order"></button></div></div></div>`;
  if (needsAddr) {
    let res = "";
    if (addr && addr.status === "match") {
      res = `<button class="choice on"><span class="radio"></span><span><b>${esc(addr.label)}</b><br><span class="small muted">About ${addr.miles} miles from our kitchen${addr.fee ? ` · <span style="color:var(--tur-ink)">Travel fee ${money(addr.fee)}</span>` : ""}</span></span></button>`;
      if (!addr.inRange && !isLDS) res += `<div class="notice bad">We deliver within ${ST.delivery.maxMiles} miles, and this is about ${addr.miles} miles away. Try another address${S.settings.pickupOnly ? "" : " or switch to pickup"}.</div>`;
      if (!addr.inRange && isLDS) res += `<div class="notice warn">This is about ${addr.miles} miles from our kitchen, past our ${ST.delivery.ldsMaxMiles}-mile range for the LIVE Dose Station.</div><div class="toggle"><span>Ask Chef to make an exception</span><button class="switch ${sh.askChef ? "on" : ""}" role="switch" aria-checked="${!!sh.askChef}" data-a="flag" data-x="askChef" aria-label="Ask Chef to make an exception"></button></div>`;
    } else if (addr && addr.status === "none") {
      res = `<div class="notice warn">We couldn't find that on the map. Check the street number, street name and ZIP.</div><div class="toggle"><span>Use it as typed - Chef will check it</span><button class="switch ${sh.asTyped ? "on" : ""}" role="switch" aria-checked="${!!sh.asTyped}" data-a="flag" data-x="asTyped" aria-label="Use it as typed"></button></div>`;
    }
    sections += `<div class="stack"><div class="h-sec" style="font-size:22px">${isLDS ? "Event address" : "Delivery address"}</div><div class="muted small">${isLDS ? "Where should our crew set up?" : "Where should we deliver?"} Try a sample address:</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">${PLACES.map((p) => `<button class="ghost small" data-a="sampleaddr" data-x="${p.key}">${p.label.split(",")[1].trim()}</button>`).join("")}</div>
      <div class="row"><input class="field" id="f-addr" data-in="addr" placeholder="Street, town, ZIP" value="${esc(draft.addr || "")}"><button class="link" data-a="checkaddr">Check</button></div>${res}</div>`;
  }
  sections += `<div class="stack"><div class="h-sec" style="font-size:22px">Date</div><div class="datechips">${dates.map((d) => { const [wd, md] = dateLabel(d.date).split(", "); return `<button class="opt ${sh.date === d.date ? "on" : ""}" data-a="date" data-x="${d.date}" aria-pressed="${sh.date === d.date}"><span class="small" style="font-weight:600">${wd}</span><b>${md}</b></button>`; }).join("")}</div></div>`;
  if (date) sections += `<div class="stack" style="gap:10px"><div class="h-sec" style="font-size:22px">${isLDS ? "On-site serving time" : ful === "delivery" ? "Delivery window" : "Pickup time"}</div>${date.slots.map((s) => `<button class="choice ${sh.slot === s.id ? "on" : ""}" data-a="slot" data-x="${s.id}"><span class="radio"></span><span><b>${s.title}</b>${s.sub ? ` <span class="small muted">${s.sub}</span>` : ""}</span></button>`).join("")}</div>`;
  if (isLDS && slot) {
    const [st] = slot.id.slice(5).split("-");
    sections += `<div class="stack" style="gap:10px"><div class="h-sec" style="font-size:22px">Your LIVE Dose schedule</div>
      <div class="panel"><div class="line"><span class="muted">Crew arrives to set up</span><span class="r">about ${t12(hhmm(mins(st) - LDS.setupMinutes))}</span></div><div class="line"><span class="muted">Serving on site</span><span class="r">${slot.title}</span></div><div class="small muted">${extraDoseNote()}</div></div>
      <div>Need longer? Add ${EXT.minutes} extra minutes of serving for ${money(EXT.fee)}.</div>
      <div class="pick" style="grid-template-columns:1fr 1fr"><button class="opt ${!sh.extend ? "on" : ""}" data-a="extend" data-x="no" aria-pressed="${!sh.extend}" style="font-weight:700">No, that's fine</button><button class="opt ${sh.extend ? "on" : ""}" data-a="extend" data-x="yes" aria-pressed="${!!sh.extend}" style="font-weight:700">Add ${EXT.minutes} min +${money(EXT.fee)}</button></div></div>`;
  }

  let review = "", total = 0;
  if (ready) {
    const o = buildOrder(sh, date, slot); total = o.subtotal;
    review = `<div class="stack"><div class="h-sec" style="font-size:22px">Review</div>
      <div class="panel">${o.lines.map((l) => `<div class="line"><div><b>${l.kind === "lds" ? l.title : (l.qtyLabel || l.qty) + " × " + esc(l.title)}</b>${l.kind === "lds" ? `<div class="small muted">${l.detail}</div>` : ""}${l.note ? `<div class="small muted">“${esc(l.note)}”</div>` : ""}</div><span class="r num">${money(l.total, true)}</span></div>`).join("")}
      ${o.extFee ? `<div class="small muted">Includes ${money(o.extFee)} for ${EXT.minutes} extra minutes of serving</div>` : ""}${o.travelFee ? `<div class="small muted">Includes ${money(o.travelFee)} travel (first ${LDS.travelFreeMiles} miles included, then $${LDS.travelFeePerBlock} per ${LDS.travelBlockMiles} miles)</div>` : ""}${o.travelUnknown ? `<div class="small muted">Chef will add any travel fee after checking the address.</div>` : ""}
      <div class="line" style="border-top:1px solid var(--line);padding-top:10px"><b>Subtotal</b><b class="r num">${money(o.subtotal, true)}</b></div></div>
      <div class="panel"><div>📅 ${esc(o.requestedTime)}</div>${o.schedule ? `<div class="small" style="padding-left:24px"><div class="line"><span class="muted">Crew arrives</span><span class="r">about ${o.schedule.arrival}</span></div><div class="line"><span class="muted">Serving on site</span><span class="r">${o.schedule.serving}</span></div>${o.schedule.extra ? `<div class="line"><span class="muted">Extra time</span><span class="r">${o.schedule.extra} min</span></div>` : ""}</div>` : ""}${o.address ? `<div>📍 ${esc(o.address)}</div>` : ""}${o.outOfRange ? `<div style="color:var(--tur-ink)">Outside our usual range - Chef will decide</div>` : ""}${o.fulfillment === "delivery" && !isLDS ? `<div class="small muted">Delivery fee based on distance - Chef adds it when confirming.</div>` : ""}<div>💵 ${S.settings.deposit ? `50% Zelle deposit after Chef approves, balance ${isLDS ? "on the day of your event" : "at " + o.fulfillment}.` : `Payment is collected ${isLDS ? "on the day of your event" : "at " + o.fulfillment}.`}</div></div>
      <div class="small muted">Nothing is charged now. Chef reviews every order and you'll get the answer here in the app.</div></div>`;
  }
  return navBar("Checkout", `<button class="link" data-a="view" data-x="cart">‹ Order</button>`, close()) +
    `<div class="body"><div class="stack" style="padding:8px 16px 24px;gap:24px">${sections}${review}</div></div>
    <div class="cartbar"><button class="btn" data-a="place" ${ready ? "" : "disabled"}>Send to Chef${ready ? " · " + money(total, true) : ""}</button></div>`;
}

function buildOrder(sh, date, slot) {
  const isLDS = !!S.cart.lds, ev = dateLabel(date.date);
  let extFee = 0, lines, address = "", outOfRange = null, travel = 0, travelUnknown = false, requestedTime, schedule = null, distance = null;
  if (isLDS) {
    const c = S.cart.lds, a = sh.addr;
    if (a.status === "match") { address = a.label; distance = a.miles; travel = a.fee || 0; if (!a.inRange) outOfRange = { miles: a.miles, max: ST.delivery.ldsMaxMiles }; }
    else { address = (draft.addr || "").trim(); travelUnknown = true; }
    extFee = sh.extend ? EXT.fee : 0;
    lines = [{ kind: "lds", title: "LIVE Dose Station", detail: ldsDetail(c), note: c.note, total: c.price + travel + extFee, travelFee: travel, extFee }];
    const [start, end] = slot.id.slice(5).split("-");
    const endLbl = t12(hhmm(mins(end) + (sh.extend ? EXT.minutes : 0)));
    schedule = { arrival: t12(hhmm(mins(start) - LDS.setupMinutes)), serving: `${t12(start)} - ${endLbl}`, extra: sh.extend ? EXT.minutes : 0 };
    requestedTime = `${ev}, LIVE Dose serving ${t12(start)} - ${endLbl}${sh.extend ? ` (incl. ${EXT.minutes} extra min)` : ""}`;
  } else {
    lines = S.cart.lines.map((l) => ({ kind: "catering", id: l.id, title: l.title, qty: l.qty, qtyLabel: qtyText(l.qty), note: l.note, total: trayTotal(l.price, l.qty) }));
    if (slot.id === "slot:pickup-am" || slot.id === "slot:pickup-pm") requestedTime = `${ev}, ${slot.id === "slot:pickup-am" ? "pickup by 11:30 AM (lunch)" : "pickup by 6:30 PM (dinner)"}`;
    else { const [a, b] = slot.id.slice(5).split("-"); requestedTime = `${ev}, ${t12(a)} - ${t12(b)}`; address = sh.addr && sh.addr.status === "match" ? sh.addr.label : (draft.addr || "").trim(); distance = sh.addr && sh.addr.miles; }
  }
  const subtotal = lines.reduce((s, l) => s + l.total, 0);
  return { extFee, lines, subtotal, address, outOfRange, travelFee: travel, travelUnknown, requestedTime, schedule, distance, eventDate: date.date, eventLabel: ev, type: isLDS ? "lds" : "catering", fulfillment: isLDS || (sh.ful === "delivery" && !S.settings.pickupOnly) ? "delivery" : "pickup" };
}

function placedSheet(sh) {
  const o = S.orders.find((x) => x.id === sh.orderId);
  return navBar("", "", "") + `<div class="body"><div class="stack" style="padding:12px 20px 24px;gap:20px"><h2 class="h-big" style="font-size:34px">Sent to Chef</h2><b class="num">Order ${o.id} · ${money(o.subtotal, true)}</b>${tiffin(o)}<div class="muted">Chef reviews every order personally. ${S.settings.deposit ? "Once approved, you'll get Zelle details for the 50% deposit right here." : "You'll get the answer right here."} Try it: answer as Chef in the panel on the right.</div><button class="btn" data-a="goorder" data-x="${o.id}">See my order</button><button class="btn soft" data-a="close">Done</button></div></div>`;
}

function multiReady(sh) { return sh.ids.every((id) => !dishById(id).requiresNote || (draft["mnote:" + id] || "").trim()); }
function multiSheet(sh) {
  const total = sh.ids.reduce((t, id) => t + trayTotal(dishById(id).price, sh.q[id] || 1), 0);
  return navBar("", close()) + `<div class="body"><div class="stack" style="padding:6px 16px 24px;gap:14px"><h2 class="h-big" style="font-size:28px">Add ${sh.ids.length} dishes</h2>
    ${sh.ids.map((id) => { const d = dishById(id), q = sh.q[id] || 1; return `<div class="panel" style="gap:10px"><div class="line"><b class="h-card" style="font-size:18px">${esc(d.title)}</b><b class="r num">${money(trayTotal(d.price, q))}</b></div>
      <div class="line" style="align-items:center"><span class="small muted">${esc([d.size, d.servesMin > 1 ? "Serves " + d.servesMin + (d.servesMax > d.servesMin ? "–" + d.servesMax : "") : ""].filter(Boolean).join(" · "))}</span><span class="r">${stepper("m:" + id, q, STEP(), ST.maxOrderQtyPerItem, STEP())}</span></div>
      <input class="field" id="f-mnote-${id}" data-in="mnote:${id}" placeholder="${d.requiresNote ? esc(d.notePrompt) : "Notes for Chef (optional)"}" value="${esc(draft["mnote:" + id] || "")}">
      ${d.requiresNote ? `<div class="small" style="color:var(--tur-ink)">Chef needs this to prepare ${esc(d.title)}.</div>` : ""}</div>`; }).join("")}
    ${S.cart.lds ? `<div class="notice warn">Your LIVE Dose Station will be replaced - catering and the LIVE Dose Station are booked as separate orders.</div>` : ""}
  </div></div><div class="cartbar"><button class="btn" data-a="multiadd" ${multiReady(sh) ? "" : "disabled"}>Add all to order · ${money(total, true)}</button></div>`;
}

function signinSheet(sh) {
  const step = sh.step || "phone";
  let inner = "";
  if (step === "phone") {
    const ok = String(draft.phone || "").replace(/\D/g, "").length === 10;
    inner = `<h2 class="h-big">Sign in to order</h2><div class="muted">We'll send a 6-digit code to your mobile on WhatsApp. Already order from us on WhatsApp? Use that number and we'll know it's you.</div>
      <input class="field num" id="f-phone" style="font-size:22px;font-weight:700" inputmode="tel" data-in="phone" placeholder="(908) 555-1234" value="${esc(phoneFmt(draft.phone || ""))}">
      <button class="btn" data-a="sendcode" data-x="whatsapp" ${ok ? "" : "disabled"} data-enable="phone">Send code on WhatsApp</button>
      <button class="btn soft" data-a="sendcode" data-x="sms" ${ok ? "" : "disabled"} data-enable="phone">Text me a code instead</button>
      <div class="small muted">No WhatsApp? We'll send a text instead after 2 minutes. Message and data rates may apply.</div>`;
  } else if (step === "code") {
    inner = `<h2 class="h-big">Enter your code</h2><div class="muted">${sh.via === "sms" ? `Sent by text message to ${phoneFmt(draft.phone)}.` : `Sent on WhatsApp to ${phoneFmt(draft.phone)}. If it doesn't arrive, a text message follows in 2 minutes.`}</div><div class="notice warn"><span>Simulator: nothing is really sent. Your code is <b class="num" style="letter-spacing:.1em">246810</b>. In the real app, the code arrives on WhatsApp or by text message.</span></div>
      <input class="field num" id="f-code" style="font-size:28px;font-weight:700;letter-spacing:.3em" inputmode="numeric" maxlength="6" data-in="code" placeholder="123456" value="${esc(draft.code || "")}">
      ${sh.err ? `<div class="notice bad">${sh.err}</div>` : ""}<button class="btn" data-a="verify">Sign in</button><button class="link" style="text-align:left" data-a="signstep" data-x="phone">Change number</button>`;
  } else {
    inner = `<h2 class="h-big">Nice to meet you</h2><div class="muted">What name should Chef put on your orders?</div>
      <input class="field" id="f-first" data-in="first" placeholder="First name" value="${esc(draft.first || "")}"><input class="field" id="f-last" data-in="last" placeholder="Last name" value="${esc(draft.last || "")}">
      ${sh.err ? `<div class="notice bad">${sh.err}</div>` : ""}<button class="btn" data-a="savename">Continue</button>`;
  }
  return navBar("", step === "name" ? "" : close("Cancel")) + `<div class="body"><div class="stack" style="padding:8px 20px 24px;gap:16px"><div>${LOGO(24)}</div>${inner}</div></div>`;
}

function composeSheet(sh) {
  const custom = sh.kind === "custom";
  if (sh.sent) return navBar("", close()) + `<div class="body"><div class="stack" style="padding:8px 20px"><h2 class="h-big">${custom ? "Custom quote" : "Ask Chef"}</h2><div class="notice">Sent to Chef. You'll get the reply in Messages.</div><button class="btn" data-a="close">Done</button></div></div>`;
  return navBar("", close()) + `<div class="body"><div class="stack" style="padding:8px 20px 24px;gap:16px"><h2 class="h-big">${custom ? "Custom quote" : "Ask Chef"}</h2>
    <div class="muted">${custom ? "Tell Chef the dishes, how many people, the date and time, and pickup or delivery (with the address). Chef replies with a price you can accept here." : "Allergies, ingredients, sizes, timing - ask anything. Chef will get back to you."}</div>
    <textarea class="field" id="f-compose" style="min-height:150px" data-in="compose" placeholder="${custom ? "e.g. North Indian lunch for 60 - paneer, dal, jeera rice, rotis. Pickup around noon." : "Your question"}">${esc(draft.compose || "")}</textarea>
    ${S.user ? "" : `<div class="small muted">You'll sign in with your phone number so Chef can reply.</div>`}
    ${sh.err ? `<div class="notice bad">${sh.err}</div>` : ""}<button class="btn" data-a="sendcompose">${custom ? "Send request" : "Send question"}</button></div></div>`;
}

// ------------------------------------------------------------------ chef side

  const name = S.user ? `${S.user.first} ${S.user.last}` : "customer", ph = S.user ? "1" + S.user.phone : "";
  const cards = [];
  S.orders.forEach((o) => {
    const lines = o.type === "custom" ? "" : o.lines.map((l) => l.kind === "lds" ? `- LIVE Dose Station: ${l.detail}${l.note ? ` (${l.note})` : ""} (+$${LDS.setupFee.toFixed(2)} setup)${l.travelFee ? ` (+$${l.travelFee.toFixed(2)} travel)` : ""}${l.extFee ? ` (+$${l.extFee.toFixed(2)} for ${EXT.minutes} extra min)` : ""} ($${l.total.toFixed(2)})` : `- ${l.qty}x ${l.title}${l.note ? ` (${l.note})` : ""} ($${l.total.toFixed(2)})`).join("\n");
    if (o.stage === "review") {
      const range = o.outOfRange ? `\nOUTSIDE RANGE: ~${o.outOfRange.miles} mi (your limit is ${o.outOfRange.max}) - customer asked for an exception` : "";
